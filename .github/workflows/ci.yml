name: CI

# Runs on every push and PR against main, plus a manual trigger. No secrets
# are required: GEMINI_API_KEY is intentionally left unset, which is exactly
# the "fresh clone, no .env" case the test suite is designed for -- the five
# live-classifier tests in test_relationships.py skip cleanly instead of
# failing, and the other 81 (of 86) run against a stubbed model with no
# network access at all.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src --max-warnings 0

      # Build BEFORE typecheck, not after. Next.js generates route-typing
      # globals (e.g. LayoutProps) into .next/types as a side effect of
      # build/dev; a fresh checkout has no .next directory yet, so running
      # `tsc --noEmit` first fails on those names with no such build ever
      # having happened. `next build` runs its own TypeScript check
      # internally, so this ordering is also strictly more correct, not just
      # a workaround -- the explicit tsc step after it is a fast, separately
      # labelled confirmation, not the first line of defense.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit
