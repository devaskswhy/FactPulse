<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="FactPulse — two documents disagree; the useful answer is almost never contradiction">
  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
    </style>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f5a623" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="#0a0a0c"/>
  <rect x="0" y="0" width="1200" height="1" fill="#232327"/>
  <rect x="0" y="359" width="1200" height="1" fill="#232327"/>

  <!-- ── left: wordmark and thesis ───────────────────────────────── -->
  <circle cx="64" cy="70" r="5" fill="#f5a623"/>
  <text x="82" y="76" class="mono" font-size="17" letter-spacing="5.5" fill="#f5f5f0">FACTPULSE</text>

  <text x="64" y="146" class="sans" font-size="35" font-weight="600" fill="#f5f5f0">Two documents disagree.</text>
  <text x="64" y="190" class="sans" font-size="35" font-weight="600" fill="#8b8b92">The useful answer is almost</text>
  <text x="64" y="234" class="sans" font-size="35" font-weight="600" fill="#8b8b92">never &#8220;contradiction&#8221;.</text>

  <rect x="64" y="266" width="46" height="1" fill="#232327"/>
  <text x="126" y="271" class="sans" font-size="16" fill="#8b8b92">A fact knowledge layer, grounded to the page and rectangle.</text>

  <!-- ── right: a real reconciled pair from the corpus ───────────── -->
  <g transform="translate(700, 58)">

    <!-- fact A -->
    <rect x="0" y="0" width="212" height="112" rx="9" fill="#131316" stroke="#232327"/>
    <text x="16" y="26" class="mono" font-size="10.5" fill="#8b8b92">RBI ANNUAL REPORT &#183; p6</text>
    <text x="16" y="52" class="sans" font-size="13.5" fill="#f5f5f0">Global economy grew</text>
    <text x="16" y="71" class="sans" font-size="13.5" fill="#f5f5f0">3.3% in 2024.</text>
    <rect x="16" y="84" width="180" height="1" fill="#232327"/>
    <text x="16" y="101" class="mono" font-size="10.5" fill="#8b8b92">basis <tspan fill="#f5f5f0">actual</tspan></text>

    <!-- fact B -->
    <rect x="288" y="0" width="212" height="112" rx="9" fill="#131316" stroke="#232327"/>
    <text x="304" y="26" class="mono" font-size="10.5" fill="#8b8b92">ECONOMIC SURVEY &#183; p5</text>
    <text x="304" y="52" class="sans" font-size="13.5" fill="#f5f5f0">IMF projected 3.2%</text>
    <text x="304" y="71" class="sans" font-size="13.5" fill="#f5f5f0">growth for 2024.</text>
    <rect x="304" y="84" width="180" height="1" fill="#232327"/>
    <text x="304" y="101" class="mono" font-size="10.5" fill="#8b8b92">basis <tspan fill="#f5f5f0">projection</tspan></text>

    <!-- the join -->
    <rect x="212" y="55" width="76" height="1.5" fill="url(#fade)"/>
    <rect x="228" y="42" width="44" height="28" rx="5" fill="#0a0a0c" stroke="#f5a623" stroke-opacity="0.5"/>
    <text x="250" y="60" class="mono" font-size="10" fill="#f5a623" text-anchor="middle">vs</text>

    <!-- the verdict -->
    <rect x="0" y="132" width="500" height="60" rx="9" fill="#f5a623" fill-opacity="0.07" stroke="#f5a623" stroke-opacity="0.32"/>
    <circle cx="24" cy="162" r="4" fill="#f5a623"/>
    <text x="40" y="157" class="mono" font-size="11" letter-spacing="1.6" fill="#f5a623">RECONCILED &#183; DIFFERS BY DEFINITION</text>
    <text x="40" y="177" class="sans" font-size="12.5" fill="#8b8b92">One is an outcome, the other a forecast. Not a conflict.</text>
  </g>

  <!-- ── the five verdicts, as a legend ──────────────────────────── -->
  <g transform="translate(64, 306)">
    <circle cx="4" cy="10" r="4" fill="#3fb27f"/>
    <text x="18" y="14" class="mono" font-size="11" fill="#8b8b92">corroborates</text>

    <circle cx="132" cy="10" r="4" fill="#e5484d"/>
    <text x="146" y="14" class="mono" font-size="11" fill="#8b8b92">contradicts</text>

    <circle cx="252" cy="10" r="4" fill="#f5a623"/>
    <text x="266" y="14" class="mono" font-size="11" fill="#8b8b92">reconciled</text>

    <circle cx="368" cy="10" r="4" fill="#6e8bd6"/>
    <text x="382" y="14" class="mono" font-size="11" fill="#8b8b92">supersedes</text>

    <circle cx="490" cy="10" r="4" fill="#3a3a40"/>
    <text x="504" y="14" class="mono" font-size="11" fill="#5d5d66">unrelated &#183; not stored</text>
  </g>
</svg>
